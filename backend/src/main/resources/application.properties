server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/container_orchestrator?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Path to the compiled C scheduler. On Windows use ../scheduler/scheduler.exe
scheduler.path=../scheduler/scheduler.exe

# Set docker.enabled=false to simulate containers (no Docker needed)
docker.enabled=true
docker.image=orchestrator-sample-app
